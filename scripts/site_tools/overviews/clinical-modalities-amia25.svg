<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AEB8C6"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1424"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D4BE0"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FE0"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8574"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8620E"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C93A72"/></marker><marker id="ah-t3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B677D"/></marker></defs><rect width="1280" height="800" fill="#FFFFFF"/><text x="56" y="64.0" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#0D1424" text-anchor="start" dominant-baseline="central">Survival analysis of fall and injury risk</text><path d="M60.0,240.0 v180.0 a110.0,35.0 0 0 0 220,0 v-180.0" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><ellipse cx="170" cy="240.0" rx="110.0" ry="35.0" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><text x="170" y="318.1" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">EHR</text><text x="170" y="351.0" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">29,045</text><text x="170" y="383.9" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">patients</text><text x="170" y="471.6" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">aged 65+: NDD, MCI</text><text x="170" y="498.4" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">or another disease</text><polyline points="290,330 340,330" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="350" y="200" width="290" height="75" rx="22" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="495.0" y="237.5" font-family="Geist" font-size="26" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">medications</text><rect x="350" y="295" width="290" height="75" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="495.0" y="332.5" font-family="Geist" font-size="26" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">laboratory tests</text><rect x="350" y="390" width="290" height="75" rx="22" fill="#FFF0DC" stroke="#B8620E" stroke-width="3"/><text x="495.0" y="427.5" font-family="Geist" font-size="26" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">race, ethnicity, sex</text><text x="495" y="491.6" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">modalities and</text><text x="495" y="518.4" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">sensitive attributes</text><polyline points="650,330 700,330" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="710" y="220" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#2D4BE0" stroke-width="3"/><text x="840" y="262.0" font-family="Geist" font-size="27" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">survival models</text><text x="840" y="300.0" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">several methods</text><path d="M745,330 h40 v20 h45 v30 h40 v25 h60" fill="none" stroke="#2D4BE0" stroke-width="5"/><text x="840" y="420.0" font-family="Geist" font-size="21" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">time to fall or injury</text><polyline points="980,330 1030,330" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="1040" y="200" width="190" height="120" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="1135.0" y="260.0" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">C-index</text><rect x="1040" y="340" width="190" height="120" rx="22" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="1135.0" y="382.9" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">hazard</text><text x="1135.0" y="417.1" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">ratios</text><rect x="110" y="590" width="1060" height="130" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="640" y="639.8" font-family="Geist" font-size="25" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">combining medications and laboratory tests raises the C-index across methods</text><text x="640" y="670.2" font-family="Geist" font-size="25" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">and removes the association between Black race and fall/injury risk</text></svg>