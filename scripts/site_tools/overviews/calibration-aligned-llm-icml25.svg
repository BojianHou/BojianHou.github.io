<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AEB8C6"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1424"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D4BE0"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FE0"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8574"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8620E"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C93A72"/></marker><marker id="ah-t3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B677D"/></marker></defs><rect width="1280" height="800" fill="#FFFFFF"/><text x="56" y="64.0" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#0D1424" text-anchor="start" dominant-baseline="central">Why alignment hurts calibration, and a fix</text><rect x="56" y="160" width="250" height="150" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="181.0" y="218.5" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Pre-trained LLM</text><text x="181.0" y="251.5" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">well calibrated</text><polyline points="316,235 366,235" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="376" y="160" width="250" height="150" rx="22" fill="#F1F3F7" stroke="#F1F3F7" stroke-width="3"/><text x="501.0" y="217.9" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Preference</text><text x="501.0" y="252.1" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">alignment</text><polyline points="636,235 686,235" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="696" y="160" width="270" height="150" rx="22" fill="#FDE7F0" stroke="#C93A72" stroke-width="3"/><text x="831.0" y="218.5" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Aligned LLM</text><text x="831.0" y="251.5" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">overconfident</text><text x="1100" y="205.7" font-family="Geist" font-size="24" font-weight="500" fill="#C93A72" text-anchor="middle" dominant-baseline="central">cause: preference</text><text x="1100" y="235.0" font-family="Geist" font-size="24" font-weight="500" fill="#C93A72" text-anchor="middle" dominant-baseline="central">collapse carries</text><text x="1100" y="264.3" font-family="Geist" font-size="24" font-weight="500" fill="#C93A72" text-anchor="middle" dominant-baseline="central">over to calibration</text><polyline points="831,320 831,380" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="56" y="390" width="900" height="330" rx="22" fill="#FFFFFF" stroke="#2D4BE0" stroke-width="3"/><text x="506" y="432.0" font-family="Geist" font-size="28" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Fine-tuning with domain knowledge</text><rect x="90" y="475" width="400" height="210" rx="22" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><text x="290" y="520.0" font-family="Geist" font-size="27" font-weight="700" fill="#2D4BE0" text-anchor="middle" dominant-baseline="central">Calibratable regime</text><text x="290" y="584.8" font-family="Geist" font-size="25" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">CFT: calibration-aware</text><text x="290" y="615.2" font-family="Geist" font-size="25" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">fine-tuning</text><rect x="522" y="475" width="400" height="210" rx="22" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="722" y="520.0" font-family="Geist" font-size="27" font-weight="700" fill="#6D3FE0" text-anchor="middle" dominant-baseline="central">Non-calibratable regime</text><text x="722" y="584.8" font-family="Geist" font-size="25" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">RCFT: EM-based ECE</text><text x="722" y="615.2" font-family="Geist" font-size="25" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">regularizer in the loss</text><polyline points="966,555 1016,555" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="1026" y="470" width="200" height="170" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="1126.0" y="522.1" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Calibrated,</text><text x="1126.0" y="555.0" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">accuracy</text><text x="1126.0" y="587.9" font-family="Geist" font-size="27" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">kept</text></svg>