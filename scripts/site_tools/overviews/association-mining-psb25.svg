th="3"/><text x="180" y="327.7" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">EHR</text><text x="180" y="361.8" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">70,420</text><text x="180" y="396.0" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">patients</text><text x="180" y="505.0" font-family="Geist" font-size="24" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">Penn Medicine</text><polyline points="305,340 355,340" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="379.5" y="224.5" width="81.0" height="51.0" rx="25.5" fill="#FDE7F0"/><text x="420" y="250.0" font-family="Geist" font-size="30" font-weight="600" fill="#C93A72" text-anchor="middle" dominant-baseline="central">AD</text><rect x="379.5" y="314.5" width="81.0" height="51.0" rx="25.5" fill="#FDE7F0"/><text x="420" y="340.0" font-family="Geist" font-size="30" font-weight="600" fill="#C93A72" text-anchor="middle" dominant-baseline="central">PD</text><rect x="379.5" y="404.5" width="81.0" height="51.0" rx="25.5" fill="#FDE7F0"/><text x="420" y="430.0" font-family="Geist" font-size="30" font-weight="600" fill="#C93A72" text-anchor="middle" dominant-baseline="central">OD</text><text x="420" y="520.0" font-family="Geist" font-size="23" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">three NDD types</text><polyline points="478,300 520,262" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><polyline points="478,380 520,418" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="530" y="195" width="270" height="125" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="665.0" y="240.4" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">univariate</text><text x="665.0" y="274.6" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">methods</text><rect x="530" y="360" width="270" height="125" rx="22" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="665.0" y="405.4" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">multivariate</text><text x="665.0" y="439.6" font-family="Geist" font-size="28" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">ML methods</text><polyline points="808,258 846,288" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><polyline points="808,422 846,392" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><circle cx="965" cy="340" r="125" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><circle cx="1105" cy="340" r="125" fill="#F0EAFF" fill-opacity="0.7" stroke="#6D3FE0" stroke-width="3"/><text x="905" y="314.4" font-family="Geist" font-size="21" font-weight="600" fill="#0B8574" text-anchor="middle" dominant-baseline="central">rare,</text><text x="905" y="340.0" font-family="Geist" font-size="21" font-weight="600" fill="#0B8574" text-anchor="middle" dominant-baseline="central">type-</text><text x="905" y="365.6" font-family="Geist" font-size="21" font-weight="600" fill="#0B8574" text-anchor="middle" dominant-baseline="central">specific</text><text x="1035" y="313.2" font-family="Geist" font-size="22" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">shared:</text><text x="1035" y="340.0" font-family="Geist" font-size="22" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">most</text><text x="1035" y="366.8" font-family="Geist" font-size="22" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">robust</text><text x="1163" y="314.4" font-family="Geist" font-size="21" font-weight="600" fill="#6D3FE0" text-anchor="middle" dominant-baseline="central">multi-</text><text x="1163" y="340.0" font-family="Geist" font-size="21" font-weight="600" fill="#6D3FE0" text-anchor="middle" dominant-baseline="central">variate</text><text x="1163" y="365.6" font-family="Geist" font-size="21" font-weight="600" fill="#6D3FE0" text-anchor="middle" dominant-baseline="central">only</text><text x="640" y="609.5" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">compare accuracy and the features each method finds:</text><text x="640" y="640.0" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">overlapping features are the most robust; univariate methods surface rare,</text><text x="640" y="670.5" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">NDD-specific features that matter clinically</text></svg>