<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AEB8C6"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1424"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D4BE0"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FE0"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8574"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8620E"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C93A72"/></marker><marker id="ah-t3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B677D"/></marker></defs><rect width="1280" height="800" fill="#FFFFFF"/><text x="56" y="64.0" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#0D1424" text-anchor="start" dominant-baseline="central">OVFM: online learning in variable feature spaces</text><rect x="56" y="160" width="330" height="340" rx="22" fill="#F1F3F7" stroke="#F1F3F7" stroke-width="3"/><text x="221" y="200.0" font-family="Geist" font-size="24" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">mixed-type data stream</text><rect x="96" y="235" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="148" y="235" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="200" y="235" width="44" height="32" rx="6" fill="#0B8574" fill-opacity="1"/><rect x="252" y="235" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="304" y="235" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="0.12"/><rect x="96" y="275" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="148" y="275" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="200" y="275" width="44" height="32" rx="6" fill="#0B8574" fill-opacity="1"/><rect x="252" y="275" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="304" y="275" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="0.12"/><rect x="96" y="315" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="148" y="315" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="200" y="315" width="44" height="32" rx="6" fill="#0B8574" fill-opacity="1"/><rect x="252" y="315" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="304" y="315" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="96" y="355" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="0.12"/><rect x="148" y="355" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="200" y="355" width="44" height="32" rx="6" fill="#0B8574" fill-opacity="1"/><rect x="252" y="355" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="304" y="355" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="96" y="395" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="0.12"/><rect x="148" y="395" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><rect x="200" y="395" width="44" height="32" rx="6" fill="#0B8574" fill-opacity="1"/><rect x="252" y="395" width="44" height="32" rx="6" fill="#2D4BE0" fill-opacity="1"/><rect x="304" y="395" width="44" height="32" rx="6" fill="#6D3FE0" fill-opacity="1"/><text x="221" y="441.6" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">old features vanish,</text><text x="221" y="468.4" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">new ones appear</text><text x="221" y="535.0" font-family="Geist" font-size="21" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">Boolean, ordinal, continuous</text><polyline points="396,330 446,330" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="456" y="190" width="300" height="130" rx="22" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="606.0" y="225.7" font-family="Geist" font-size="24" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Gaussian copula:</text><text x="606.0" y="255.0" font-family="Geist" font-size="24" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">map to a latent</text><text x="606.0" y="284.3" font-family="Geist" font-size="24" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">normal space</text><rect x="456" y="350" width="300" height="110" rx="22" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><text x="606.0" y="390.4" font-family="Geist" font-size="24" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">online EM:</text><text x="606.0" y="419.6" font-family="Geist" font-size="24" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">feature correlations</text><text x="606" y="506.6" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">reconstructs missed old features</text><text x="606" y="533.4" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">and warm-starts new ones</text><polyline points="766,255 816,280" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><polyline points="766,405 816,380" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="826" y="200" width="230" height="110" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="941.0" y="241.6" font-family="Geist" font-size="22" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">learner on</text><text x="941.0" y="268.4" font-family="Geist" font-size="22" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">observed features</text><rect x="826" y="350" width="230" height="110" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="941.0" y="391.6" font-family="Geist" font-size="22" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">learner on</text><text x="941.0" y="418.4" font-family="Geist" font-size="22" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">latent features</text><polyline points="1066,255 1110,300" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><polyline points="1066,405 1110,360" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="1120" y="260" width="110" height="140" rx="22" fill="#FFF0DC" stroke="#B8620E" stroke-width="3"/><text x="1175.0" y="316.0" font-family="Geist" font-size="23" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">en-</text><text x="1175.0" y="344.0" font-family="Geist" font-size="23" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">semble</text><text x="640" y="645.4" font-family="Geist" font-size="24" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">models the joint distribution of mixed data without assuming a linear map</text><text x="640" y="674.6" font-family="Geist" font-size="24" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">or a Gaussian joint; the ensemble speeds up online convergence</text></svg>