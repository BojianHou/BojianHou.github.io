stroke-width="3"/><path d="M70,227.0 l42.0,-42.0 h120 l-42.0,42.0 z" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><path d="M190,227.0 l42.0,-42.0 v120 l-42.0,42.0 z" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><text x="151.0" y="379.0" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">AV-45, group 1</text><path d="M250,227.0 h120 v120 h-120 z" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><path d="M250,227.0 l42.0,-42.0 h120 l-42.0,42.0 z" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><path d="M370,227.0 l42.0,-42.0 v120 l-42.0,42.0 z" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><text x="331.0" y="379.0" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">AV-45, group 2</text><path d="M70,442.0 h120 v120 h-120 z" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><path d="M70,442.0 l42.0,-42.0 h120 l-42.0,42.0 z" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><path d="M190,442.0 l42.0,-42.0 v120 l-42.0,42.0 z" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="151.0" y="594.0" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">FDG, group 1</text><path d="M250,442.0 h120 v120 h-120 z" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><path d="M250,442.0 l42.0,-42.0 h120 l-42.0,42.0 z" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><path d="M370,442.0 l42.0,-42.0 v120 l-42.0,42.0 z" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="331.0" y="594.0" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">FDG, group 2</text><polyline points="430,380 480,380" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="490" y="250" width="330" height="260" rx="22" fill="#FFFFFF" stroke="#2D4BE0" stroke-width="3"/><text x="655" y="300.0" font-family="Geist" font-size="28" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Joint analysis</text><text x="655" y="351.1" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">dual sparsity:</text><text x="655" y="380.4" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">shared + individual</text><text x="655" y="409.6" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">structure;</text><text x="655" y="438.9" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">block coordinate ascent</text><polyline points="830,380 880,380" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="890" y="200" width="340" height="130" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="1060" y="240.0" font-family="Geist" font-size="26" font-weight="700" fill="#0B8574" text-anchor="middle" dominant-baseline="central">shared weights</text><text x="1060" y="288.0" font-family="Geist" font-size="22" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">consistent across groups</text><rect x="890" y="360" width="340" height="160" rx="22" fill="#FFF0DC" stroke="#B8620E" stroke-width="3"/><text x="1060" y="400.0" font-family="Geist" font-size="26" font-weight="700" fill="#B8620E" text-anchor="middle" dominant-baseline="central">group-specific weights</text><text x="1060" y="444.6" font-family="Geist" font-size="22" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">e.g., sex-specific cross-</text><text x="1060" y="471.4" font-family="Geist" font-size="22" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">modality correlations</text><text x="640" y="704.8" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">finds sex-specific correlations between AV-45 and FDG PET in an Alzheimer’s cohort</text><text x="640" y="735.2" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">that TCCA misses</text></svg>