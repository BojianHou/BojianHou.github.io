<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AEB8C6"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1424"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D4BE0"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FE0"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8574"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8620E"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C93A72"/></marker><marker id="ah-t3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B677D"/></marker></defs><rect width="1280" height="800" fill="#FFFFFF"/><text x="56" y="64.0" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#0D1424" text-anchor="start" dominant-baseline="central">PFERM: fairness with prior knowledge</text><rect x="56" y="170" width="330" height="330" rx="22" fill="#F1F3F7" stroke="#F1F3F7" stroke-width="3"/><text x="221" y="210.0" font-family="Geist" font-size="24" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">groups differ in prevalence</text><line x1="110" y1="420" x2="330" y2="420" stroke="#AEB8C6" stroke-width="3"/><rect x="127.6" y="275.5" width="74.8" height="144.5" rx="4" fill="#C93A72"/><rect x="237.6" y="335.0" width="74.8" height="85.0" rx="4" fill="#C93A72"/><text x="166" y="455.0" font-family="Geist" font-size="24" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">group A</text><text x="276" y="455.0" font-family="Geist" font-size="24" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">group B</text><text x="221" y="521.6" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">e.g., Alzheimer’s disease is</text><text x="221" y="548.4" font-family="Geist" font-size="22" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">more prevalent in women</text><polyline points="396,335 446,335" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="434.8" y="207.9" width="250.5" height="44.2" rx="22.1" fill="#FFF0DC"/><text x="560" y="230.0" font-family="Geist" font-size="26" font-weight="600" fill="#B8620E" text-anchor="middle" dominant-baseline="central">prior knowledge</text><text x="560" y="275.4" font-family="Geist" font-size="24" font-weight="600" fill="#B8620E" text-anchor="middle" dominant-baseline="central">prevalence ratio</text><text x="560" y="304.6" font-family="Geist" font-size="24" font-weight="600" fill="#B8620E" text-anchor="middle" dominant-baseline="central">between groups</text><polyline points="560,335 560,385 690,385" fill="none" stroke="#B8620E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-amber)"/><rect x="700" y="230" width="320" height="300" rx="22" fill="#FFFFFF" stroke="#2D4BE0" stroke-width="3"/><text x="860" y="280.0" font-family="Geist" font-size="30" font-weight="700" fill="#2D4BE0" text-anchor="middle" dominant-baseline="central">Fair ERM</text><text x="860" y="336.1" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">minimize expected risk</text><text x="860" y="365.4" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">subject to a fairness</text><text x="860" y="394.6" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">constraint that includes</text><text x="860" y="423.9" font-family="Geist" font-size="24" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">the prevalence ratio</text><polyline points="1028,380 1054,380" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="1060" y="270" width="170" height="220" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="1145.0" y="348.3" font-family="Geist" font-size="26" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">accurate</text><text x="1145.0" y="380.0" font-family="Geist" font-size="26" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">and fair</text><text x="1145.0" y="411.7" font-family="Geist" font-size="26" font-weight="600" fill="#0D1424" text-anchor="middle" dominant-baseline="central">classifier</text><text x="640" y="634.8" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">strict equal treatment can sacrifice accuracy when prevalence differs;</text><text x="640" y="665.2" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">the prior keeps fairness while preserving accuracy</text></svg>