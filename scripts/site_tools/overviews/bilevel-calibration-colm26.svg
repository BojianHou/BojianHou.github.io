<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AEB8C6"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D1424"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D4BE0"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FE0"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8574"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8620E"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C93A72"/></marker><marker id="ah-t3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B677D"/></marker></defs><rect width="1280" height="800" fill="#FFFFFF"/><text x="56" y="64.0" font-family="Bricolage Grotesque" font-size="40" font-weight="700" fill="#0D1424" text-anchor="start" dominant-baseline="central">Bilevel optimization for LLM calibration</text><rect x="56" y="260" width="250" height="270" rx="22" fill="#FDE7F0" stroke="#C93A72" stroke-width="3"/><text x="181" y="305.0" font-family="Geist" font-size="30" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Aligned LLM</text><text x="181" y="345.0" font-family="Geist" font-size="26" font-weight="600" fill="#C93A72" text-anchor="middle" dominant-baseline="central">overconfident</text><line x1="96" y1="495" x2="266" y2="495" stroke="#AEB8C6" stroke-width="3"/><rect x="102.8" y="487.8" width="28.9" height="7.2" rx="4" fill="#C93A72"/><rect x="145.3" y="381.0" width="28.9" height="114.0" rx="4" fill="#C93A72"/><rect x="187.8" y="485.4" width="28.9" height="9.6" rx="4" fill="#C93A72"/><rect x="230.3" y="489.0" width="28.9" height="6.0" rx="4" fill="#C93A72"/><polyline points="316,395 380,395" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="392" y="150" width="500" height="190" rx="22" fill="#F0EAFF" stroke="#6D3FE0" stroke-width="3"/><text x="642" y="196.0" font-family="Geist" font-size="30" font-weight="700" fill="#6D3FE0" text-anchor="middle" dominant-baseline="central">Upper level</text><text x="642" y="247.5" font-family="Geist" font-size="27" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">choose loss hyperparameters λ</text><text x="642" y="280.5" font-family="Geist" font-size="27" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">to maximize predictive entropy</text><rect x="392" y="450" width="500" height="190" rx="22" fill="#E9EDFF" stroke="#2D4BE0" stroke-width="3"/><text x="642" y="496.0" font-family="Geist" font-size="30" font-weight="700" fill="#2D4BE0" text-anchor="middle" dominant-baseline="central">Lower level</text><text x="642" y="547.5" font-family="Geist" font-size="27" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">train the LLM θ under</text><text x="642" y="580.5" font-family="Geist" font-size="27" font-weight="500" fill="#0D1424" text-anchor="middle" dominant-baseline="central">the parametric loss L(θ; λ)</text><polyline points="520,346 520,440" fill="none" stroke="#6D3FE0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-violet)"/><text x="488" y="393.0" font-family="Geist" font-size="32" font-weight="700" fill="#6D3FE0" text-anchor="middle" dominant-baseline="central">λ</text><polyline points="764,444 764,350" fill="none" stroke="#2D4BE0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-blue)"/><text x="822" y="397.0" font-family="Geist" font-size="30" font-weight="700" fill="#2D4BE0" text-anchor="middle" dominant-baseline="central">θ*(λ)</text><text x="642" y="700.0" font-family="Geist" font-size="25" font-weight="500" fill="#5B677D" text-anchor="middle" dominant-baseline="central">first-order approximation: no second-order terms, practical at LLM scale</text><polyline points="902,395 966,395" fill="none" stroke="#AEB8C6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-line)"/><rect x="976" y="260" width="250" height="270" rx="22" fill="#E0F3EF" stroke="#0B8574" stroke-width="3"/><text x="1101" y="305.0" font-family="Geist" font-size="30" font-weight="700" fill="#0D1424" text-anchor="middle" dominant-baseline="central">Calibrated LLM</text><text x="1101" y="345.0" font-family="Geist" font-size="26" font-weight="600" fill="#0B8574" text-anchor="middle" dominant-baseline="central">also out of domain</text><line x1="1016" y1="495" x2="1186" y2="495" stroke="#AEB8C6" stroke-width="3"/><rect x="1022.8" y="456.6" width="28.9" height="38.4" rx="4" fill="#0B8574"/><rect x="1065.3" y="429.0" width="28.9" height="66.0" rx="4" fill="#0B8574"/><rect x="1107.8" y="449.4" width="28.9" height="45.6" rx="4" fill="#0B8574"/><rect x="1150.3" y="465.0" width="28.9" height="30.0" rx="4" fill="#0B8574"/></svg>